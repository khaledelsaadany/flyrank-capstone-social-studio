version: '3.8'
services:
  social-studio:
    build: .
    container_name: flyrank-social-studio
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/social_studio.db
      - DEFAULT_PUBLISHER_ADAPTER=mock_x
    restart: unless-stopped
